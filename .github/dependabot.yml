version: 2
updates:
    # The root manifest is the workspace, so this also covers xtask and
    # interop-tests.
    - package-ecosystem: cargo
      directory: /
      schedule:
          interval: weekly
      groups:
          cargo:
              update-types: [minor, patch]

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      groups:
          github-actions:
              patterns: ["*"]
