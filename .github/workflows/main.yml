name: CI
on:
    push:
    pull_request:
    schedule:
        - cron: "0 0 * * 1"
env:
    CARGO_TERM_COLOR: always
    OIDN_VERSION: 2.4.1
jobs:
    build_linux:
        runs-on: ubuntu-latest
        strategy:
          matrix:
            rust_channel: [stable, beta, nightly]
        steps:
            - uses: actions/checkout@v4
            - name: Set up Rust toolchain
              uses: actions-rs/toolchain@v1
              with:
                toolchain: ${{ matrix.rust_channel }}
                override: true
                components: rustfmt, clippy
            - name: Cache OIDN download (Linux)
              id: cache-oidn
              uses: actions/cache@v4
              with:
                path: oidn-${{ env.OIDN_VERSION }}.x86_64.linux.tar.gz
                key: ${{ runner.os }}-oidn-${{ env.OIDN_VERSION }}-x86_64
            - name: Download and extract OIDN (Linux)
              if: steps.cache-oidn.outputs.cache-hit != 'true'
              run: cargo run -p xtask -- download-oidn-package
            - name: Set OIDN env (Linux)
              run: |
                echo "OIDN_DIR=$(pwd)/oidn-${OIDN_VERSION}.x86_64.linux" >> $GITHUB_ENV
                echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$(pwd)/oidn-${OIDN_VERSION}.x86_64.linux/lib" >> $GITHUB_ENV
            - run: rustup update
            - run: cargo build --all --all-targets
            - run: cargo clippy --all --all-targets -- -D warnings
            - run: cargo test --all --all-targets
            - name: Test bundled download and extraction (Linux)
              run: cargo test -p oidn --all-targets --features bundled
              env:
                  LD_LIBRARY_PATH: ""
            - name: Lint bundled build (Linux)
              run: cargo clippy -p oidn --all-targets --features bundled -- -D warnings
              env:
                  LD_LIBRARY_PATH: ""
            - run: cargo doc --all --no-deps --document-private-items
              env:
                  RUSTDOCFLAGS: -Dwarnings
            - name: Format Core
              run: cargo fmt -- --check
    build_mac:
        runs-on: macos-latest
        strategy:
          matrix:
            rust_channel: [stable, beta, nightly]
        steps:
            - uses: actions/checkout@v4
            - name: Set up Rust toolchain
              uses: actions-rs/toolchain@v1
              with:
                toolchain: ${{ matrix.rust_channel }}
                override: true
                components: rustfmt, clippy
            - name: Cache OIDN download (macOS)
              id: cache-oidn
              uses: actions/cache@v4
              with:
                path: oidn-${{ env.OIDN_VERSION }}.*.macos.tar.gz
                key: ${{ runner.os }}-oidn-${{ env.OIDN_VERSION }}-macos
            - name: Download and extract OIDN (macOS)
              if: steps.cache-oidn.outputs.cache-hit != 'true'
              run: cargo run -p xtask -- download-oidn-package
            - name: Set OIDN env (macOS)
              run: |
                # find extracted macOS package directory (arm64/x86_64)
                dir=$(ls -d oidn-${OIDN_VERSION}.*.macos 2>/dev/null || true)
                echo "OIDN_BUNDLED_DIR=${{ github.workspace }}/$dir" >> $GITHUB_ENV
                echo "DYLD_LIBRARY_PATH=$DYLD_LIBRARY_PATH:${{ github.workspace }}/$dir/lib" >> $GITHUB_ENV
                cp ${GITHUB_WORKSPACE}/$dir/lib/*dylib .
            - run: rustup update
            - run: cargo build --all --all-targets
            - run: cargo clippy --all --all-targets -- -D warnings
            - name: Build bundled feature (macOS)
              run: cargo build -p oidn --all-targets --features bundled
              env:
                  DYLD_LIBRARY_PATH: ""
                  OIDN_BUNDLED_DIR: ${{ github.workspace }}/oidn-${{ env.OIDN_VERSION }}.arm64.macos
            - name: Test bundled feature (macOS)
              run: cargo test -p oidn --all-targets --features bundled
              env:
                  DYLD_LIBRARY_PATH: ""
                  OIDN_BUNDLED_DIR: ${{ github.workspace }}/oidn-${{ env.OIDN_VERSION }}.arm64.macos
    build_windows:
        runs-on: windows-latest
        strategy:
          matrix:
            rust_channel: [stable, beta, nightly]
        steps:
            - uses: actions/checkout@v4
            - name: Set up Rust toolchain
              uses: actions-rs/toolchain@v1
              with:
                toolchain: ${{ matrix.rust_channel }}
                override: true
                components: rustfmt, clippy
            - name: Cache OIDN download (Windows)
              id: cache-oidn
              uses: actions/cache@v4
              with:
                path: oidn-${{ env.OIDN_VERSION }}.x64.windows.zip
                key: ${{ runner.os }}-oidn-${{ env.OIDN_VERSION }}-x64-windows
            - name: Ensure unzip tools (Windows)
              if: steps.cache-oidn.outputs.cache-hit != 'true'
              run: choco install 7zip -y
            - name: Download and extract OIDN (Windows)
              if: steps.cache-oidn.outputs.cache-hit != 'true'
              run: cargo run -p xtask -- download-oidn-package
            - name: Set OIDN env (Windows)
              run: |
                powershell -Command "${env:OIDN_DIR} = Join-Path $env:GITHUB_WORKSPACE \"oidn-${env:OIDN_VERSION}.x64.windows\"; [System.Environment]::SetEnvironmentVariable('OIDN_DIR', $env:OIDN_DIR, 'Process');"
            - run: rustup update
            - run: |
                $env:OIDN_DIR="${env:GITHUB_WORKSPACE}/oidn-${env:OIDN_VERSION}.x64.windows/"
                cargo build --all --all-targets
            - run: |
                $env:OIDN_DIR="${env:GITHUB_WORKSPACE}/oidn-${env:OIDN_VERSION}.x64.windows/"
                cargo clippy --all --all-targets -- -D warnings
            - name: Build bundled feature (Windows)
              run: cargo build -p oidn --all-targets --features bundled
              env:
                  OIDN_BUNDLED_DIR: ${{ github.workspace }}/oidn-${{ env.OIDN_VERSION }}.x64.windows
            - name: Test bundled feature (Windows)
              run: cargo test -p oidn --all-targets --features bundled
              env:
                  OIDN_BUNDLED_DIR: ${{ github.workspace }}/oidn-${{ env.OIDN_VERSION }}.x64.windows

