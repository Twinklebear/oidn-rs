name: CI
on:
    push:
    pull_request:
    schedule:
        - cron: "0 0 * * 1"
env:
    CARGO_TERM_COLOR: always
    OIDN_VERSION: 2.4.1
jobs:
    build_linux:
        runs-on: ubuntu-latest
        strategy:
          matrix:
            rust_channel: [stable, beta, nightly]
        steps:
            - uses: actions/checkout@v4
            - name: Set up Rust toolchain
              uses: actions-rs/toolchain@v1
              with:
                toolchain: ${{ matrix.rust_channel }}
                override: true
                components: rustfmt, clippy
            - name: Cache OIDN download (Linux)
              id: cache-oidn
              uses: actions/cache@v4
              with:
                path: |
                  oidn-${{ env.OIDN_VERSION }}.x86_64.linux.tar.gz
                  oidn-${{ env.OIDN_VERSION }}.x86_64.linux
                key: ${{ runner.os }}-oidn-${{ env.OIDN_VERSION }}-x86_64
            - name: ensure OIDN package (Linux)
              run: cargo run -p xtask -- download-oidn-package
            - name: Set OIDN env (Linux)
              run: |
                echo "OIDN_DIR=$(pwd)/oidn-${OIDN_VERSION}.x86_64.linux" >> $GITHUB_ENV
                echo "OIDN_BUNDLED_DIR=$(pwd)/oidn-${OIDN_VERSION}.x86_64.linux" >> $GITHUB_ENV
                echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$(pwd)/oidn-${OIDN_VERSION}.x86_64.linux/lib" >> $GITHUB_ENV
            - run: rustup update
            - run: cargo build --all --all-targets
            - run: cargo clippy --all --all-targets -- -D warnings
            - run: cargo test --all --all-targets
            - name: Test bundled download and extraction (Linux)
              run: cargo test -p oidn --all-targets --features bundled
              env:
                  OIDN_DIR: ""
                  LD_LIBRARY_PATH: ""
            - name: Lint bundled build (Linux)
              run: cargo clippy -p oidn --all-targets --features bundled -- -D warnings
              env:
                  OIDN_DIR: ""
                  LD_LIBRARY_PATH: ""
            - run: cargo doc --workspace --exclude xtask --exclude build-tools --no-deps --document-private-items
              env:
                  RUSTDOCFLAGS: -Dwarnings
            - name: Format Core
              run: cargo fmt -- --check
    build_mac:
        runs-on: macos-latest
        strategy:
          matrix:
            rust_channel: [stable, beta, nightly]
        steps:
            - uses: actions/checkout@v4
            - name: Set up Rust toolchain
              uses: actions-rs/toolchain@v1
              with:
                toolchain: ${{ matrix.rust_channel }}
                override: true
                components: rustfmt, clippy
            - name: Cache OIDN download (macOS)
              id: cache-oidn
              uses: actions/cache@v4
              with:
                path: |
                  oidn-${{ env.OIDN_VERSION }}.*.macos.tar.gz
                  oidn-${{ env.OIDN_VERSION }}.*.macos
                key: ${{ runner.os }}-oidn-${{ env.OIDN_VERSION }}-macos
            - name: ensure OIDN package (macOS)
              run: cargo run -p xtask -- download-oidn-package
            - name: Set OIDN env (macOS)
              run: |
                # find extracted macOS package directory (arm64/x86_64)
                dir=$(ls -d oidn-${OIDN_VERSION}.*.macos 2>/dev/null | head -n 1)
                test -n "$dir"
                echo "OIDN_DIR=${{ github.workspace }}/$dir" >> $GITHUB_ENV
                echo "OIDN_BUNDLED_DIR=${{ github.workspace }}/$dir" >> $GITHUB_ENV
                echo "DYLD_LIBRARY_PATH=$DYLD_LIBRARY_PATH:${{ github.workspace }}/$dir/lib" >> $GITHUB_ENV
                cp ${GITHUB_WORKSPACE}/$dir/lib/*dylib .
            - run: rustup update
            - run: cargo build --all --all-targets
            - run: cargo clippy --all --all-targets -- -D warnings
            - name: Build bundled feature (macOS)
              run: cargo build -p oidn --all-targets --features bundled
              env:
                  DYLD_LIBRARY_PATH: ""
                  OIDN_DIR: ""
            - name: Test bundled feature (macOS)
              run: cargo test -p oidn --all-targets --features bundled
              env:
                  DYLD_LIBRARY_PATH: ""
                  OIDN_DIR: ""
    build_windows:
        runs-on: windows-latest
        strategy:
          matrix:
            rust_channel: [stable, beta, nightly]
        steps:
            - uses: actions/checkout@v4
            - name: Set up Rust toolchain
              uses: actions-rs/toolchain@v1
              with:
                toolchain: ${{ matrix.rust_channel }}
                override: true
                components: rustfmt, clippy
            - name: Cache OIDN download (Windows)
              id: cache-oidn
              uses: actions/cache@v4
              with:
                path: |
                  oidn-${{ env.OIDN_VERSION }}.x64.windows.zip
                  oidn-${{ env.OIDN_VERSION }}.x64.windows
                key: ${{ runner.os }}-oidn-${{ env.OIDN_VERSION }}-x64-windows
            - name: ensure OIDN package (Windows)
              run: cargo run -p xtask -- download-oidn-package
            - name: Set OIDN env (Windows)
              run: |
                echo "OIDN_DIR=${env:GITHUB_WORKSPACE}/oidn-${env:OIDN_VERSION}.x64.windows" | Out-File -FilePath $env:GITHUB_ENV -Append
                echo "OIDN_BUNDLED_DIR=${env:GITHUB_WORKSPACE}/oidn-${env:OIDN_VERSION}.x64.windows" | Out-File -FilePath $env:GITHUB_ENV -Append
            - run: rustup update
            - run: |
                $env:OIDN_DIR="${env:GITHUB_WORKSPACE}/oidn-${env:OIDN_VERSION}.x64.windows/"
                cargo build --all --all-targets
            - run: |
                $env:OIDN_DIR="${env:GITHUB_WORKSPACE}/oidn-${env:OIDN_VERSION}.x64.windows/"
                cargo clippy --all --all-targets -- -D warnings
            - name: Build bundled feature (Windows)
              run: cargo build -p oidn --all-targets --features bundled
              env:
                  OIDN_DIR: ""
            - name: Test bundled feature (Windows)
              run: cargo test -p oidn --all-targets --features bundled
              env:
                  OIDN_DIR: ""

