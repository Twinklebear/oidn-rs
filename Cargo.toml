[package]
name = "oidn"
version = "2.5.0"
edition = "2024"
authors = ["Will Usher <will@willusher.io>", "hill <hill@hilll.dev>"]
build = "build.rs"
homepage = "https://github.com/Twinklebear/oidn-rs"
documentation = "https://docs.rs/oidn"
repository = "https://github.com/Twinklebear/oidn-rs"
readme = "README.md"
license = "MIT"
description = "A wrapper for the Intel OpenImageDenoise image denoising library."
keywords = ["openimagedenoise", "denoise", "denoising"]
include = [
    "/Cargo.toml",
    "/LICENSE.md",
    "/README.md",
    "/build.rs",
    "/shared/helper.rs",
    "/src/**",
    "/tests/**",
    "/examples/*.rs",
]
links = "OpenImageDenoise"

[workspace]
members = [".", "xtask"]
default-members = ["."]
resolver = "3"

[features]
default = ["pkg-config"]
bundled = ["ureq", "sha2", "flate2", "tar", "zip"]
# Direct3D 12 interop test, which needs a GPU that can import external
# memory and semaphores.
d3d12-interop = ["dep:windows"]

[dependencies]
bitflags = "2.12"
num_enum = "0.7.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
    "Win32_System_Threading",
] }

[[test]]
name = "d3d12_interop"
required-features = ["d3d12-interop"]

[build-dependencies]
ureq = { version = "3.3", optional = true }
sha2 = { version = "0.11", optional = true }
flate2 = { version = "1.1", optional = true }
tar = { version = "0.4", optional = true }
zip = { version = "8.6", default-features = false, features = [
    "deflate",
], optional = true }
pkg-config = { version = "0.3.33", optional = true }

[dev-dependencies]
rand = "0.10.1"
image = "0.25.10"
exr = "1.74.0"
docopt = "1.1.1"
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
