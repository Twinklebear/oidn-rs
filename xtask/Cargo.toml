[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["bundled"]
bundled = []

[dependencies]
ureq = { version = "3.3" }
sha2 = { version = "0.11" }
flate2 = { version = "1.1" }
tar = { version = "0.4" }
zip = { version = "8.6", default-features = false, features = ["deflate"] }
bindgen = "0.72.1"
